name: Android live microphone input test

on:
  push:
    branches: ["aqss/android-live-sound-check", "aqss/android-microphone-lifecycle", "aqss/sound-check-recaps", "aqss/android-input-deadlines", "aqss/tv-photo-labels", "aqss/tv-photo-text-bounds", "aqss/tv-photo-selection", "aqss/android-full-photo", "aqss/photo-review-deadline", "aqss/photo-work-ownership", "aqss/photo-work-ready", "aqss/photo-retry-guidance", "aqss/sound-permission-settings", "aqss/voice-permission-settings", "aqss/build-details", "aqss/share-build-details", "aqss/private-support-report", "aqss/support-report-privacy"]
    paths:
      - "native/android/**"
      - "native/ios/Tests/AQSSNativeFeedbackTests/Fixtures/**"
      - "tools/smoke_android_live_input.py"
      - "tools/record_android_test_apk.py"
      - ".github/workflows/android-live-input.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "native/android/**"
      - "native/ios/Tests/AQSSNativeFeedbackTests/Fixtures/**"
      - "tools/smoke_android_live_input.py"
      - "tools/record_android_test_apk.py"
      - ".github/workflows/android-live-input.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-input-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-live-input:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
      - name: Compile, test input arithmetic and freshness, and check Android lint
        run: |
          sdkmanager "platforms;android-36"
          gradle -p native/android :testDebugUnitTest :app:assembleLiveInput :app:lintLiveInput :uiprobe:assembleDebug :sharereceiver:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inspect permission, input, lifecycle and time limit in Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -delay-adb
          script: timeout 540 python3 tools/smoke_android_live_input.py
      - name: Verify APK signature, opening poster and exact source identity
        run: python3 tools/record_android_test_apk.py
      - name: Retain live test APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioBodyguard-Live-Input-Test
          path: native/android/app/build/outputs/apk/liveInput/app-liveInput.apk
          if-no-files-found: error
          retention-days: 14
      - name: Retain test and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-input-verification
          path: |
            artifacts/ui/android-live-input/
            native/android/build/test-results/testDebugUnitTest/
            native/android/app/build/reports/lint-results-liveInput.*
          if-no-files-found: ignore
          retention-days: 14
