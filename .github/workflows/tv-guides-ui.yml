name: TV brand picture guide verification

on:
  push:
    branches: ["aqss/tv-guide-clarity-0323", "aqss/overnight-cyan-guide-audit"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tv-guide-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-tv-guides:
    name: TV guides on Android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact verification source
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          record = {'source_commit': source,
                    'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                    'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                    'workflow_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'scope': 'Android emulator guide navigation; no physical pairing'}
          output = pathlib.Path('artifacts/ui/android-live-input')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'source-identity.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, sort_keys=True))
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
      - name: Compile app and isolated UI observers
        run: |
          sdkmanager "platforms;android-36"
          gradle -p native/android :app:assembleLiveInput :uiprobe:assembleDebug :sharereceiver:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify TV guide navigation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -delay-adb
          script: timeout 1500 python3 tools/smoke_android_live_input.py --tv-guides-only
      - name: Retain TV guide Android UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-guides-android-ui
          path: artifacts/ui/android-live-input/
          if-no-files-found: error
          retention-days: 14

  iphone-tv-guides:
    name: TV guides on ${{ matrix.device }} Simulator
    strategy:
      fail-fast: false
      matrix:
        include:
          - device: iPhone
            artifact: iphone
          - device: iPad
            artifact: ipad
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact verification source
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          record = {'source_commit': source,
                    'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                    'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                    'workflow_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'scope': '${{ matrix.device }} Simulator guide navigation; no signed installation or physical pairing'}
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sound-check-screenshots'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'source-identity.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, sort_keys=True))
          PYTHON
      - name: Verify TV guide choices and large text
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("${{ matrix.device }}") and d.get("isAvailable",True)))')"
          echo "AQSS_SIMULATOR=$simulator_udid" >> "$GITHUB_ENV"
          # XCTest accessibility must initialize on a fully booted Simulator.
          # Keep every UI assertion intact; do not disable AX or skip tests.
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b
          xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj -scheme AQSSReadOnly \
            -configuration Release -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$RUNNER_TEMP/tv-guide-build" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-tv-guides.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testTVCodePicturesSeparateTheTVFromPhoneAndKeepOptionalLinksNeutral \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testBrandPlatformsKeepRokuMenusSeparateAndOfferManualGoogleTVSetup \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testLGVizioAndGoogleTVContinueIntoTheirOwnPhoneAppPictures \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPhilipsAlreadyConnectedSkipsPairingAndBackRestoresTheChoice \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testNewBrandPicturesAreReachable \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testSonyLegacyAndHisenseVIDAAKeepTheirOwnPicturesAndBack \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testNewVizioTVShowsAccountThenPhonePicturesInOrder \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testLargestTextKeepsExitAndNextReachable \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testTVNetworkRejectsPublicAddressWithoutContact \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testTVAddressPicturesKeepTheCheckDraftAndStepOrder \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testTVNetworkVisitClearsDraftOnBackgroundAndBack \
            CODE_SIGNING_ALLOWED=NO test
      - name: Verify VIZIO report Cancel preserves isolated clipboard
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_ios_build_share_clipboard.py prepare "$AQSS_SIMULATOR" --output "$RUNNER_TEMP/vizio-share-receipts"
          xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj -scheme AQSSReadOnly \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/tv-guide-build" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/sound-vizio-cancel.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testTVNetworkRejectedReportCancelPreservesClipboard \
            CODE_SIGNING_ALLOWED=NO test
          python3 tools/check_ios_build_share_clipboard.py cancel "$AQSS_SIMULATOR" --output "$RUNNER_TEMP/vizio-share-receipts"
      - name: Verify exact VIZIO report native Copy bytes
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj -scheme AQSSReadOnly \
            -configuration Release -derivedDataPath "$RUNNER_TEMP/tv-guide-build" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/sound-vizio-copy.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testTVNetworkRejectedReportCopyMatchesActualReviewedText \
            CODE_SIGNING_ALLOWED=NO test
          python3 tools/check_ios_tv_network_clipboard.py "$AQSS_SIMULATOR" \
            "$RUNNER_TEMP/sound-vizio-copy.xcresult" \
            "$RUNNER_TEMP/tv-guide-build/Build/Products/Release-iphonesimulator/AQSSReadOnly.app/Info.plist" \
            "$RUNNER_TEMP/vizio-share-receipts"
      - name: Clear isolated VIZIO clipboard fixture
        if: always()
        shell: bash
        run: |
          if test -n "$AQSS_SIMULATOR"; then
            python3 tools/check_ios_build_share_clipboard.py clear "$AQSS_SIMULATOR" --output "$RUNNER_TEMP/vizio-share-receipts"
          fi
      - name: Export native TV guide screenshots
        if: always()
        run: python3 tools/export_ios_input_screenshots.py "$RUNNER_TEMP" tv-guides vizio-cancel vizio-copy
      - name: Retain TV guide iPhone screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-guides-${{ matrix.artifact }}-ui
          path: |
            ${{ runner.temp }}/sound-check-screenshots/
            ${{ runner.temp }}/vizio-share-receipts/
          if-no-files-found: error
          retention-days: 14
      - name: Retain TV guide iPhone test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-guides-${{ matrix.artifact }}-xcresult
          path: |
            ${{ runner.temp }}/sound-tv-guides.xcresult
            ${{ runner.temp }}/sound-vizio-*.xcresult
          if-no-files-found: ignore
          retention-days: 14
