name: PCM16 accounting lab (no audio backend)

on:
  workflow_dispatch:
  push:
    branches: ["aqss/**"]
    paths:
      - "native/lab/pcm16_accounting/**"
      - ".github/workflows/pcm16-accounting.yml"
  pull_request:
    branches: ["main", "master"]
    paths:
      - "native/lab/pcm16_accounting/**"
      - ".github/workflows/pcm16-accounting.yml"

permissions:
  contents: read

concurrency:
  group: aqss-pcm16-accounting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  accounting:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile and test the isolated accounting model
        run: gradle -p native/lab/pcm16_accounting test
      - name: Retain lab test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pcm16-accounting-${{ github.run_id }}-${{ github.run_attempt }}
          path: native/lab/pcm16_accounting/build/test-results/test
          if-no-files-found: ignore
          retention-days: 7
