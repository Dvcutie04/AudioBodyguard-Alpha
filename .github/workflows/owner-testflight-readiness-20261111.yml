name: Observe the new internal TestFlight build
on:
  push:
    branches: ["release/owner-testflight-20261111-2a51c43"]
    paths: [".github/workflows/owner-testflight-readiness-20261111.yml"]
permissions:
  contents: read
  actions: read
concurrency:
  group: aqss-owner-testflight-readiness-20261111
  cancel-in-progress: false
jobs:
  signed-release:
    if: github.repository == 'Dvcutie04/AudioBodyguard-Alpha' && github.actor == 'Dvcutie04'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Observe only the already-requested signed release to completion
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          """Read-only, bounded guard for one already-requested signed release."""
          import json
          import os
          import time
          import urllib.request
          import urllib.error

          REPO = 'Dvcutie04/AudioBodyguard-Alpha'
          MAIN = 'e1d53fc2b70066d7d6096851612fb66386a6f0e7'
          PARENT = '2c4dc455da605204911509b61b28b6e73c66b2d3'
          BRANCH = 'release/owner-testflight-20261111-2a51c43'
          HELPER = '.github/workflows/owner-testflight-readiness-20261111.yml'
          RUN = 43139474513
          WORKFLOW = 380984259
          BLOB = '65a3ef3804638479fbbde17c5a4bcfdacdd98302'
          REQUIRED_JOBS = {
              'identify-source', 'checked-candidate', 'signed-upload',
              'core-checks / Python contracts and regression suite',
              'core-checks / Swift contracts and read-only iOS simulator app',
              'core-checks / C11 owned-output lab (scripted backend)',
              'core-checks / Android contracts and read-only APK',
              'device-preflight / unsigned-device-archive',
              'native-walkthroughs / Verify and package connected appearance for Appetize',
              'native-walkthroughs / Verify Android setup and contextual help',
              'native-walkthroughs / Verify iPhone navigation',
              'native-walkthroughs / Verify iPhone pictures',
              'native-walkthroughs / Verify iPhone tools',
          }

          class Blocked(RuntimeError):
              pass

          def need(condition, reason):
              if not condition:
                  raise Blocked(reason)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  raise Blocked('GitHub read redirected; credentials were not forwarded')

          def api(path):
              need(path.startswith('/') and not path.startswith('//'), 'Invalid read path')
              request = urllib.request.Request('https://api.github.com/repos/'+REPO+path,
                  method='GET', headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                  'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                      need(response.status == 200, 'Unexpected GitHub response')
                      raw = response.read(2_000_001)
              except urllib.error.HTTPError as error:
                  raise Blocked('GitHub read returned HTTP '+str(error.code)) from None
              except (urllib.error.URLError, OSError, TimeoutError):
                  raise Blocked('GitHub read failed; no release operation was retried') from None
              need(len(raw) <= 2_000_000, 'Oversized read response')
              return json.loads(raw)

          def validate_context(api, env):
              need(env.get('GITHUB_REPOSITORY') == REPO and env.get('GITHUB_REF') == 'refs/heads/'+BRANCH
                   and env.get('GITHUB_EVENT_NAME') == 'push' and env.get('GITHUB_ACTOR') == 'Dvcutie04'
                   and env.get('GITHUB_RUN_NUMBER') == '1' and env.get('GITHUB_RUN_ATTEMPT') == '1', 'Wrong one-shot context')
              sha = env.get('GITHUB_SHA','')
              need(len(sha) == 40 and all(c in '0123456789abcdef' for c in sha), 'Invalid helper identity')
              need([p['sha'] for p in api('/git/commits/'+sha)['parents']] == [PARENT], 'Unexpected helper parent')
              diff = api('/compare/'+PARENT+'...'+sha)
              files = diff.get('files', [])
              need(diff.get('ahead_by') == 1 and diff.get('behind_by') == 0 and diff.get('total_commits') == 1
                   and len(files) == 1 and files[0].get('filename') == HELPER and files[0].get('status') == 'added',
                   'Observer changes files outside itself')
              need(api('/contents/.github/workflows/testflight-beta.yml?ref='+MAIN).get('sha') == BLOB,
                   'Pinned release workflow mismatch')

          def validate_run(run):
              need(run.get('id') == RUN and run.get('workflow_id') == WORKFLOW and run.get('run_number') == 17
                   and run.get('run_attempt') == 1 and run.get('head_sha') == MAIN and run.get('head_branch') == 'main'
                   and run.get('event') == 'workflow_dispatch' and run.get('path') == '.github/workflows/testflight-beta.yml'
                   and run.get('repository',{}).get('full_name') == REPO, 'Signed release identity changed')
              status = run.get('status')
              need(status in {'queued','pending','waiting','in_progress','completed'}, 'Unknown release state')
              if status == 'completed':
                  need(run.get('conclusion') == 'success', 'Signed release did not succeed; Apple availability not inferred')
                  return True
              return False

          def verify_completed_jobs(api):
              collected = []
              for page in range(1, 11):
                  response = api(f'/actions/runs/{RUN}/jobs?per_page=100&page={page}')
                  jobs = response.get('jobs')
                  total = response.get('total_count')
                  need(isinstance(jobs,list) and type(total) is int and total >= 0, 'Invalid jobs list')
                  collected.extend(jobs)
                  if len(collected) >= total:
                      need(len(collected) == total, 'Inconsistent jobs pagination')
                      break
                  need(bool(jobs), 'Incomplete jobs pagination')
              else:
                  raise Blocked('Too many jobs to verify')
              need(len({j['id'] for j in collected}) == len(collected), 'Duplicate jobs')
              for name in REQUIRED_JOBS:
                  matching = [j for j in collected if j.get('name') == name]
                  need(len(matching) == 1 and matching[0].get('run_id') == RUN
                       and matching[0].get('status') == 'completed' and matching[0].get('conclusion') == 'success',
                       'Required signed-release job not successful: '+name)

          def await_success(api, *, clock=time.monotonic, sleep=time.sleep, max_seconds=3600, interval=30):
              deadline = clock()+max_seconds
              while True:
                  run = api(f'/actions/runs/{RUN}')
                  if validate_run(run):
                      verify_completed_jobs(api)
                      return
                  if clock() >= deadline:
                      raise Blocked('Observation window ended before signed-release success; no availability claim')
                  sleep(min(interval, max(0, deadline-clock())))

          if __name__ == '__main__':
              try:
                  validate_context(api, os.environ)
                  await_success(api)
              except (Blocked, KeyError, TypeError, ValueError):
                  print('SIGNED_RELEASE_OBSERVATION_BLOCKED: no Apple availability established; inspect release run 43139474513')
                  raise SystemExit(1) from None
              print('EXACT_SIGNED_RELEASE_COMPLETED: 43139474513 / 17.1; validate package provenance before querying Apple')
          PYTHON
  apple-readiness:
    needs: signed-release
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: testflight-internal
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 2c4dc455da605204911509b61b28b6e73c66b2d3
          persist-credentials: false
          sparse-checkout: tools/release_20261111_apple_readiness.py
          sparse-checkout-cone-mode: false
      - name: Verify the reviewed observer bytes
        run: |
          python3 - <<'PYTHON'
          import hashlib, pathlib
          source = pathlib.Path('tools/release_20261111_apple_readiness.py').read_bytes()
          if hashlib.sha256(source).hexdigest() != 'fd7b32140a2effe5e3e66e8f75b72bea222a67258ee938aedf5f643ebb8dd6dc':
              raise SystemExit('Observer source mismatch; Apple credentials will not be used')
          PYTHON
      - name: Download only the exact release's non-secret upload provenance
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          repository: Dvcutie04/AudioBodyguard-Alpha
          run-id: 43139474513
          name: aqss-testflight-provenance-43139474513
          path: ${{ runner.temp }}/aqss-owner-provenance
      - name: Verify the uploaded package identity before querying Apple
        env:
          PROVENANCE_DIRECTORY: ${{ runner.temp }}/aqss-owner-provenance
        shell: bash
        run: |
          python3 - <<'PYTHON'
          """Match the downloaded non-secret upload receipt to this single requested build."""
          import json
          import os
          from pathlib import Path
          import re

          SOURCE = '2a51c435491a0524f85f530a69e54c6869c2e014'
          TREE = 'bdae3290b5e39555c2976293b4f8a333c2b85708'

          class Blocked(RuntimeError):
              pass

          def validate(report):
              expected = {
                  'source_revision':SOURCE, 'source_tree_sha':TREE,
                  'workflow_run_id':'43139474513', 'workflow_attempt':'1',
                  'app_version':'1.0.0', 'build_number':'17.1',
                  'delivery_status':'UPLOAD_ACCEPTED_PROCESSING_UNVERIFIED',
                  'evidence_scope':'SIGNED_IPA_UPLOAD_ACCEPTED_PROCESSING_UNVERIFIED',
                  'testflight_audience_requested':'internal', 'internal_only_export_configured':True,
                  'physical_protection_qualified':False,
              }
              for key, value in expected.items():
                  if type(report.get(key)) is not type(value) or report.get(key) != value:
                      raise Blocked('Upload receipt does not match the requested internal release')
              for key in ('submitted_ipa_sha256','privacy_manifest_sha256','export_options_sha256'):
                  if not isinstance(report.get(key),str) or not re.fullmatch(r'[0-9a-f]{64}',report[key]):
                      raise Blocked('Missing package digest')
              bundle=report.get('bundle_id')
              if not isinstance(bundle,str) or not re.fullmatch(r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+',bundle) or bundle.endswith('.demo'):
                  raise Blocked('Invalid ordinary app bundle')
              return {'bundle_id':bundle, 'build':'17.1', 'version':'1.0.0', 'source':SOURCE,
                      'tree':TREE,'submitted_ipa_sha256':report['submitted_ipa_sha256']}

          def main():
              root=Path(os.environ['PROVENANCE_DIRECTORY'])
              files=list(root.rglob('*'))
              regular=[p for p in files if p.is_file()]
              if len(regular)!=1 or regular[0].name != 'testflight-upload-provenance.json' or regular[0].is_symlink() or regular[0].stat().st_size>65536:
                  raise Blocked('Expected exactly one bounded upload provenance file')
              identity=validate(json.loads(regular[0].read_text(encoding='utf-8')))
              Path(os.environ['GITHUB_ENV']).open('a').write('EXPECTED_BUNDLE_ID='+identity['bundle_id']+'\nEXPECTED_IPA_SHA256='+identity['submitted_ipa_sha256']+'\n')
              print('PINNED_UPLOAD_PROVENANCE_VERIFIED: 1.0.0 (17.1), source '+SOURCE)

          if __name__ == '__main__':
              try:
                  main()
              except (Blocked, KeyError, TypeError, ValueError, OSError):
                  print('UPLOAD_PROVENANCE_MISMATCH: Apple observation will not run')
                  raise SystemExit(1) from None
          PYTHON
      - name: Read only the exact new build's Apple processing and internal access
        env:
          IOS_BUNDLE_ID: ${{ vars.IOS_BUNDLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY_P8_BASE64: ${{ secrets.ASC_PRIVATE_KEY_P8_BASE64 }}
          READINESS_RECEIPT: ${{ runner.temp }}/apple-beta-readiness.json
        run: python3 tools/release_20261111_apple_readiness.py
      - name: Retain the non-secret read-only observation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aqss-apple-readiness-43139474513
          path: ${{ runner.temp }}/apple-beta-readiness.json
          if-no-files-found: ignore
          retention-days: 7
