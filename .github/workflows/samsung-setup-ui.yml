name: Samsung setup guide verification

on:
  push:
    branches: ["aqss/samsung-setup-review"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: samsung-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-samsung:
    name: Samsung guide on Android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact verification source
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          record = {'source_commit': source,
                    'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                    'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                    'workflow_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'scope': 'Android emulator guide navigation; no physical pairing'}
          output = pathlib.Path('artifacts/ui/android-live-input')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'source-identity.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, sort_keys=True))
          PYTHON
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
      - name: Compile app and isolated UI observers
        run: |
          sdkmanager "platforms;android-36"
          gradle -p native/android :app:assembleLiveInput :uiprobe:assembleDebug :sharereceiver:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify Samsung pairing and phone guide navigation
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -delay-adb
          script: timeout 420 python3 tools/smoke_android_live_input.py --samsung-setup-only
      - name: Retain Samsung Android UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samsung-android-ui
          path: artifacts/ui/android-live-input/
          if-no-files-found: error
          retention-days: 14

  iphone-samsung:
    name: Samsung guide on iPhone Simulator
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Record exact verification source
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          record = {'source_commit': source,
                    'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
                    'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                    'workflow_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
                    'scope': 'iPhone Simulator guide navigation; no signed installation or physical pairing'}
          output = pathlib.Path(os.environ['RUNNER_TEMP']) / 'sound-check-screenshots'
          output.mkdir(parents=True, exist_ok=True)
          (output / 'source-identity.json').write_text(json.dumps(record, indent=2) + '\n')
          print(json.dumps(record, sort_keys=True))
          PYTHON
      - name: Verify Samsung approval, saved progress, phone handoff and large text
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone") and d.get("isAvailable",True)))')"
          xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj -scheme AQSSReadOnly \
            -configuration Release -destination "platform=iOS Simulator,id=$simulator_udid" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-samsung.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testSamsungPinChoiceBackAndResumeStayAtTheApproval \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testIllustratedApprovalFinishesWithoutClaimingConnection \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testFinishedPairingPicturesAdvanceLocallyAndCloseKeepsThePhoneStep \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testLargestTextKeepsExitAndNextReachable \
            CODE_SIGNING_ALLOWED=NO test
      - name: Export native Samsung screenshots
        if: always()
        run: python3 tools/export_ios_input_screenshots.py "$RUNNER_TEMP" samsung
      - name: Retain Samsung iPhone screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samsung-ios-ui
          path: ${{ runner.temp }}/sound-check-screenshots/
          if-no-files-found: error
          retention-days: 14
      - name: Retain Samsung iPhone test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: samsung-ios-xcresult
          path: ${{ runner.temp }}/sound-samsung.xcresult
          if-no-files-found: ignore
          retention-days: 14
