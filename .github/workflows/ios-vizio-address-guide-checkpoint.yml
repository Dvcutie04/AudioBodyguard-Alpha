name: Verify VIZIO address pictures on iPhone and iPad

on:
  push:
    branches: ["codex/vizio-ipad-address-hosted-verification"]

permissions:
  contents: read

jobs:
  address-guide:
    name: VIZIO address guide on ${{ matrix.device }} Simulator
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: af09bde093b78a496124843946799f636a4a8e54
          persist-credentials: false
      - name: Verify source and run the address guide test
        shell: bash
        env:
          SIMULATOR_DEVICE: ${{ matrix.device }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = af09bde093b78a496124843946799f636a4a8e54
          test "$(git rev-parse 'HEAD^{tree}')" = 1b2d831a38bf079828baaf4574ab0fec9db11f92
          git log -1 --format='Source %H%nTree %T'
          python3 tools/prepare_ios_software_ui.py --check
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c 'import json, os, sys; devices = json.load(sys.stdin)["devices"]; print(next(device["udid"] for group in devices.values() for device in group if device["name"].startswith(os.environ["SIMULATOR_DEVICE"])))')"
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b
          xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj \
            -scheme AQSSReadOnly -configuration Release \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$RUNNER_TEMP/vizio-address-build" \
            -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/vizio-address.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testTVAddressPicturesKeepTheCheckDraftAndStepOrder \
            CODE_SIGNING_ALLOWED=NO test
      - name: Keep XCUITest results and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vizio-address-guide-${{ matrix.device }}-xcresult
          path: ${{ runner.temp }}/vizio-address.xcresult
          if-no-files-found: ignore
          retention-days: 14
