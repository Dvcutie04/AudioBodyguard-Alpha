name: Combined setup and output report verification

on:
  push:
    branches: ["aqss/setup-output-report"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: setup-output-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-setup-output:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
      - name: Record exact verification source
        run: |
          python3 - <<'PYTHON'
          import json, os, pathlib, subprocess
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert source == os.environ['GITHUB_SHA']
          output = pathlib.Path('artifacts/ui/android-live-input')
          output.mkdir(parents=True, exist_ok=True)
          (output / 'source-identity.json').write_text(json.dumps({
              'source_commit': source,
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'workflow_run_id': os.environ['GITHUB_RUN_ID'],
              'workflow_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'scope': 'Combined immutable output snapshot and setup notes; no playback or physical qualification'
          }, indent=2) + '\n')
          PYTHON
      - name: Compile app and callback regression probe
        run: |
          sdkmanager "platforms;android-36"
          gradle -p native/android :app:assembleLiveInput :uiprobe:assembleDebug :sharereceiver:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify combined setup and output snapshot sharing
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -delay-adb
          script: timeout 600 python3 tools/smoke_android_live_input.py --setup-output-report-only
      - name: Retain native output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-output-android-ui
          path: artifacts/ui/android-live-input/
          if-no-files-found: error
          retention-days: 14

