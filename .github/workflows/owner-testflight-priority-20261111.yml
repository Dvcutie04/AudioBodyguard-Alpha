name: Prioritize the owner internal TestFlight release
on:
  push:
    branches: ["release/owner-testflight-20261111-2a51c43"]
    paths: [".github/workflows/owner-testflight-priority-20261111.yml"]
permissions:
  contents: read
concurrency:
  group: aqss-owner-testflight-priority-20261111
  cancel-in-progress: false
jobs:
  prioritize:
    if: github.repository == 'Dvcutie04/AudioBodyguard-Alpha' && github.actor == 'Dvcutie04'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Release only the redundant unsigned queue blocker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          """Cancel one redundant unsigned push run; preserve the real release's checks."""
          import json
          import os
          import urllib.request
          import urllib.error
          from pathlib import Path

          REPO = 'Dvcutie04/AudioBodyguard-Alpha'
          MAIN = 'e1d53fc2b70066d7d6096851612fb66386a6f0e7'
          PARENT = 'e316cb3133cfa28e102c0c5a7470a74316452712'
          BRANCH = 'release/owner-testflight-20261111-2a51c43'
          PATH = '.github/workflows/owner-testflight-priority-20261111.yml'
          UNSIGNED = 43139347527
          SIGNED = 43139474513
          WORKFLOW = 380984259
          BLOB = '65a3ef3804638479fbbde17c5a4bcfdacdd98302'

          class Blocked(RuntimeError):
              pass

          def need(condition, reason):
              if not condition:
                  raise Blocked(reason)

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args):
                  raise Blocked('Redirect refused')

          def api(path, *, cancel=False):
              need(not cancel or path == f'/actions/runs/{UNSIGNED}/cancel', 'Only the pinned unsigned run may be cancelled')
              token = os.environ.get('GH_TOKEN', '')
              need(bool(token), 'Missing token')
              request = urllib.request.Request('https://api.github.com/repos/'+REPO+path,
                  method='POST' if cancel else 'GET', data=b'{}' if cancel else None,
                  headers={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json',
                           'Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              try:
                  with urllib.request.build_opener(NoRedirect).open(request, timeout=30) as response:
                      need(response.status == (202 if cancel else 200), 'Unexpected API status')
                      raw = response.read(2_000_001)
              except urllib.error.HTTPError as error:
                  raise Blocked('GitHub returned HTTP '+str(error.code)) from None
              except (urllib.error.URLError, OSError, TimeoutError):
                  raise Blocked('API transport failed; do not blindly repeat') from None
              need(len(raw) <= 2_000_000, 'Oversized response')
              return json.loads(raw) if raw else {}

          def prioritize(api, env):
              need(env.get('GITHUB_REPOSITORY') == REPO and env.get('GITHUB_REF') == 'refs/heads/'+BRANCH
                   and env.get('GITHUB_ACTOR') == 'Dvcutie04' and env.get('GITHUB_EVENT_NAME') == 'push'
                   and env.get('GITHUB_RUN_NUMBER') == '1' and env.get('GITHUB_RUN_ATTEMPT') == '1', 'Wrong one-shot context')
              sha = env.get('GITHUB_SHA', '')
              need(len(sha) == 40 and all(c in '0123456789abcdef' for c in sha), 'Invalid helper identity')
              need([p['sha'] for p in api('/git/commits/'+sha)['parents']] == [PARENT], 'Unexpected helper parent')
              diff = api('/compare/'+PARENT+'...'+sha)
              need(diff.get('ahead_by') == 1 and diff.get('behind_by') == 0 and diff.get('total_commits') == 1,
                   'Unexpected helper history')
              files = diff.get('files', [])
              need(len(files) == 1 and files[0].get('filename') == PATH and files[0].get('status') == 'added', 'Unexpected helper diff')
              need(api('/git/ref/heads/main')['object']['sha'] == MAIN, 'Main moved')
              need(api('/contents/.github/workflows/testflight-beta.yml?ref='+MAIN).get('sha') == BLOB,
                   'Existing signing workflow changed')
              old, new = [api('/actions/runs/'+str(run)) for run in (UNSIGNED, SIGNED)]
              for item, ident, event in ((old,UNSIGNED,'push'), (new,SIGNED,'workflow_dispatch')):
                  need(item.get('id') == ident and item.get('workflow_id') == WORKFLOW
                       and item.get('event') == event and item.get('head_sha') == MAIN
                       and item.get('head_branch') == 'main' and item.get('run_attempt') == 1
                       and item.get('repository',{}).get('full_name') == REPO, 'Run identity mismatch')
              need(new.get('run_number') == 17, 'Wrong signed release')
              if old.get('status') == 'completed' or new.get('status') == 'in_progress':
                  return {'state':'NO_CANCEL_NEEDED','signed_release_run':SIGNED}
              need(old.get('status') in {'queued','in_progress'} and new.get('status') in {'pending','queued'}, 'Unexpected scheduling state')
              jobs = api('/actions/runs/'+str(UNSIGNED)+'/jobs?per_page=100')
              need(type(jobs.get('total_count')) is int and jobs['total_count'] == len(jobs.get('jobs',[])), 'Incomplete job list')
              need(not any('signed-upload' in j.get('name','') and j.get('conclusion') != 'skipped' for j in jobs['jobs']),
                   'Unsigned run unexpectedly contains an active signing job')
              # One ordinary cancellation, no force-cancel, no rerun, no dispatch, no edits.
              api('/actions/runs/'+str(UNSIGNED)+'/cancel', cancel=True)
              return {'state':'REDUNDANT_UNSIGNED_CANCEL_REQUESTED','unsigned_run':UNSIGNED,
                      'signed_release_run':SIGNED,'signed_release_checks_unchanged':True}

          if __name__ == '__main__':
              try:
                  result = prioritize(api, os.environ)
              except (Blocked, KeyError, TypeError, ValueError) as error:
                  print('RELEASE_PRIORITY_BLOCKED: '+str(error)); raise SystemExit(1) from None
              text = json.dumps(result, indent=2); print(text)
              if os.environ.get('GITHUB_STEP_SUMMARY'):
                  with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a') as file:
                      file.write('## Owner release priority\n\n```json\n'+text+'\n```\n')
                      file.write('The unsigned push run is not a release gate for run 17.1. Run 17.1 retains all its own unchanged checks and protected signing.\n')
          PYTHON
