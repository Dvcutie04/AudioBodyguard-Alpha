name: iPhone foreground sound-check verification

on:
  workflow_dispatch:
  push:
    branches: ["aqss/ios-live-sound-check"]

permissions:
  contents: read

concurrency:
  group: ios-live-input-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-sound-check:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test digital input arithmetic and lifecycle window
        run: swift test --package-path native/ios
      - name: Build and prepare iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone") and d.get("isAvailable",True)))')"
          echo "AQSS_SIMULATOR=$simulator_udid" >> "$GITHUB_ENV"
          xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj -scheme AQSSReadOnly \
            -configuration Release -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$RUNNER_TEMP/sound-check-build" CODE_SIGNING_ALLOWED=NO build-for-testing
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl install "$simulator_udid" "$RUNNER_TEMP/sound-check-build/Build/Products/Release-iphonesimulator/AQSSReadOnly.app"
          python3 - "$RUNNER_TEMP/sound-check-build/Build/Products" <<'PYTHON'
          import pathlib, plistlib, sys
          root = pathlib.Path(sys.argv[1])
          source, = root.glob('*.xctestrun')
          original = plistlib.loads(source.read_bytes())
          for mode in ('DENIED', 'GRANTED'):
              data = plistlib.loads(plistlib.dumps(original))
              targets = [v for v in data.values() if isinstance(v, dict) and v.get('IsUITestBundle')]
              assert len(targets) == 1, 'Expected exactly one UI test target'
              targets[0].setdefault('EnvironmentVariables', {})['AQSS_TEST_MIC_' + mode] = '1'
              (root / ('sound-' + mode.lower() + '.xctestrun')).write_bytes(plistlib.dumps(data))
          PYTHON
      - name: Verify idle navigation and denied permission
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl privacy "$AQSS_SIMULATOR" revoke microphone com.aqss.bodyguard.prototype
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-denied.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-denied.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testLiveSoundCheckStartsOffAndHelpReturnsWithoutCapture \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testLiveSoundCheckDeniedPermissionNeverStartsCapture
      - name: Verify granted input, Stop, Home and the 30-second cap when available
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl privacy "$AQSS_SIMULATOR" grant microphone com.aqss.bodyguard.prototype
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-granted.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-granted.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testLiveSoundCheckStopsOnHomeAndRequiresAnotherStart
      - name: Keep Simulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sound-check-evidence
          path: |
            ${{ runner.temp }}/sound-denied.xcresult
            ${{ runner.temp }}/sound-granted.xcresult
          if-no-files-found: ignore
          retention-days: 7
