name: iPhone foreground input verification

on:
  workflow_dispatch:
  push:
    branches: ["aqss/ios-live-sound-check", "aqss/ios-microphone-lifecycle", "aqss/android-microphone-lifecycle", "aqss/sound-check-recaps", "aqss/tv-photo-labels", "aqss/tv-photo-text-bounds", "aqss/tv-photo-selection", "aqss/photo-review-deadline", "aqss/photo-work-ownership", "aqss/photo-work-ready", "aqss/photo-retry-guidance", "aqss/sound-permission-settings", "aqss/voice-permission-settings", "aqss/build-details", "aqss/share-build-details", "aqss/private-support-report", "aqss/support-report-privacy"]

permissions:
  contents: read

concurrency:
  group: ios-live-input-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-sound-check:
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test digital input, shared ownership and bounded speech results
        run: swift test --package-path native/ios
      - name: Build and prepare iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone") and d.get("isAvailable",True)))')"
          echo "AQSS_SIMULATOR=$simulator_udid" >> "$GITHUB_ENV"
          xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj -scheme AQSSReadOnly \
            -configuration Release -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$RUNNER_TEMP/sound-check-build" CODE_SIGNING_ALLOWED=NO build-for-testing
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl install "$simulator_udid" "$RUNNER_TEMP/sound-check-build/Build/Products/Release-iphonesimulator/AQSSReadOnly.app"
          python3 - <<'PYTHON'
          import datetime, hashlib, os, pathlib
          fixture = pathlib.Path('native/ios/Tests/AQSSNativeFeedbackTests/Fixtures/tv-photo-labels.png')
          assert hashlib.sha256(fixture.read_bytes()).hexdigest() == '2f55775447c5d28841737a25713ae83a76b37bb6d614fa33007621ce92853f31'
          # Different capture dates identify each fixture in the real Photos picker.
          for day, name in enumerate(('empty', 'unrelated', 'brand-only'), 15):
              photo = fixture.with_name('tv-photo-' + name + '.png')
              captured = datetime.datetime(2026, 1, day, 12, tzinfo=datetime.timezone.utc).timestamp()
              os.utime(photo, (captured, captured))
          PYTHON
          xcrun simctl addmedia "$simulator_udid" native/ios/Tests/AQSSNativeFeedbackTests/Fixtures/tv-photo-labels.png
          for photo_case in empty unrelated brand-only; do
            xcrun simctl addmedia "$simulator_udid" "native/ios/Tests/AQSSNativeFeedbackTests/Fixtures/tv-photo-$photo_case.png"
          done
          python3 - "$RUNNER_TEMP/sound-check-build/Build/Products" <<'PYTHON'
          import pathlib, plistlib, sys
          root = pathlib.Path(sys.argv[1])
          source, = root.glob('*.xctestrun')
          original = plistlib.loads(source.read_bytes())
          app_info = plistlib.loads((root / 'Release-iphonesimulator/AQSSReadOnly.app/Info.plist').read_bytes())
          assert all(isinstance(app_info.get(key), str) and app_info[key] for key in ('CFBundleShortVersionString', 'CFBundleVersion'))
          for mode in ('DENIED', 'GRANTED'):
              data = plistlib.loads(plistlib.dumps(original))
              targets = [v for v in data.values() if isinstance(v, dict) and v.get('IsUITestBundle')]
              assert len(targets) == 1, 'Expected exactly one UI test target'
              targets[0].setdefault('EnvironmentVariables', {})['AQSS_TEST_MIC_' + mode] = '1'
              targets[0]['EnvironmentVariables']['AQSS_TEST_APP_VERSION'] = app_info['CFBundleShortVersionString']
              targets[0]['EnvironmentVariables']['AQSS_TEST_APP_BUILD'] = app_info['CFBundleVersion']
              targets[0]['EnvironmentVariables']['AQSS_TEST_PHOTO'] = '1'
              targets[0]['EnvironmentVariables']['AQSS_TEST_PHOTO_MODIFIED_AT'] = str(pathlib.Path('native/ios/Tests/AQSSNativeFeedbackTests/Fixtures/tv-photo-labels.png').stat().st_mtime)
              for name in ('empty', 'unrelated', 'brand-only'):
                  key = 'AQSS_TEST_PHOTO_' + name.upper().replace('-', '_') + '_MODIFIED_AT'
                  targets[0]['EnvironmentVariables'][key] = str(pathlib.Path('native/ios/Tests/AQSSNativeFeedbackTests/Fixtures/tv-photo-' + name + '.png').stat().st_mtime)
              (root / ('sound-' + mode.lower() + '.xctestrun')).write_bytes(plistlib.dumps(data))
          PYTHON
      - name: Verify native build-only report Cancel
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_ios_build_share_clipboard.py prepare "$AQSS_SIMULATOR" --output "$RUNNER_TEMP/support-report-build-only-clipboard"
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-denied.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-support-report-build-only-cancel.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPrivateSupportReportBuildOnlyCancelReturnsWithoutCopy
          python3 tools/check_ios_build_share_clipboard.py cancel "$AQSS_SIMULATOR" --output "$RUNNER_TEMP/support-report-build-only-clipboard"
      - name: Verify idle navigation and denied permission
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl privacy "$AQSS_SIMULATOR" revoke microphone com.aqss.bodyguard.prototype
          python3 tools/check_ios_build_share_clipboard.py prepare "$AQSS_SIMULATOR" --output "$RUNNER_TEMP/build-share-clipboard"
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-denied.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-denied.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testBuildDetailsMatchInstalledMetadataAndReturnToSettings \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testBuildDetailsShareCancelReturnsWithoutCopy \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testLiveSoundCheckStartsOffAndHelpReturnsWithoutCapture \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testVoiceCheckStartsIdleAndClosingItLeavesMeterUsable \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testVoiceCheckDeniedMicrophoneCannotRequestSpeechOrCapture \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testInputToolsStartIdleAndNeverClaimAConnection \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPhotoReviewGuidanceAndReplacement
          python3 tools/check_ios_build_share_clipboard.py cancel "$AQSS_SIMULATOR" --output "$RUNNER_TEMP/build-share-clipboard"
      - name: Verify native iPhone Copy and exact clipboard handoff
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-denied.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-build-share-copy.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testBuildDetailsShareOnlyInstalledMetadataAndReturn
          python3 tools/check_ios_build_share_clipboard.py copy "$AQSS_SIMULATOR" --app-info "$RUNNER_TEMP/sound-check-build/Build/Products/Release-iphonesimulator/AQSSReadOnly.app/Info.plist" --output "$RUNNER_TEMP/build-share-clipboard"
      - name: Verify native support report cancel
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_ios_build_share_clipboard.py prepare "$AQSS_SIMULATOR" --output "$RUNNER_TEMP/support-report-clipboard"
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-denied.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-support-report-cancel.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPrivateSupportReportCancelReturnsWithoutCopy
          python3 tools/check_ios_build_share_clipboard.py cancel "$AQSS_SIMULATOR" --output "$RUNNER_TEMP/support-report-clipboard"
      - name: Verify native support report copy
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-denied.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-support-report-copy.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPrivateSupportReportSharesOnlyPreviewedFieldsAndReturns
          python3 tools/check_ios_build_share_clipboard.py copy "$AQSS_SIMULATOR" --app-info "$RUNNER_TEMP/sound-check-build/Build/Products/Release-iphonesimulator/AQSSReadOnly.app/Info.plist" --support-report --output "$RUNNER_TEMP/support-report-clipboard"
      - name: Verify exact native build-only report Copy
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          :
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-denied.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-support-report-build-only-copy.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPrivateSupportReportBuildOnlyCopySharesOnlyBuildDetails
          python3 tools/check_ios_build_share_clipboard.py copy "$AQSS_SIMULATOR" --app-info "$RUNNER_TEMP/sound-check-build/Build/Products/Release-iphonesimulator/AQSSReadOnly.app/Info.plist" --output "$RUNNER_TEMP/support-report-build-only-clipboard"
      - name: Verify denied and granted Settings returns
        shell: bash
        run: |
          set -euo pipefail
          # This test changes real consent. Give it an explicit denied fixture
          # after the other denied tests and before the granted-input suite.
          xcrun simctl privacy "$AQSS_SIMULATOR" revoke microphone com.aqss.bodyguard.prototype
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-denied.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-settings.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testLiveSoundCheckDeniedPermissionNeverStartsCapture
      - name: Verify Voice microphone Settings returns
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl privacy "$AQSS_SIMULATOR" revoke microphone com.aqss.bodyguard.prototype
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-denied.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-voice-microphone.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testVoiceMicrophoneSettingsReturnStaysOff
      - name: Verify completed sound checks can be excluded without deletion
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl privacy "$AQSS_SIMULATOR" grant microphone com.aqss.bodyguard.prototype
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-granted.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-support-report-populated-build-only.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPrivateSupportReportExcludesCompletedCheckWithoutClearing
          python3 tools/check_ios_build_share_clipboard.py copy "$AQSS_SIMULATOR" --app-info "$RUNNER_TEMP/sound-check-build/Build/Products/Release-iphonesimulator/AQSSReadOnly.app/Info.plist" --output "$RUNNER_TEMP/support-report-populated-build-only-clipboard"
      - name: Verify granted input, Stop, Home and the 30-second cap when available
        shell: bash
        run: |
          set -euo pipefail
          xcrun simctl privacy "$AQSS_SIMULATOR" grant microphone com.aqss.bodyguard.prototype
          # Earlier tests never request speech. Use the fresh runner's real consent prompt; simctl cannot reset Speech TCC on this runtime.
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/sound-check-build/Build/Products/sound-granted.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-granted.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testLiveSoundCheckStopsOnHomeAndRequiresAnotherStart \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testVoiceSpeechPermissionGrantDoesNotStartDeferredCapture \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPrivateSupportReportIncludesCompletedCheckAndClears
          python3 tools/check_ios_build_share_clipboard.py copy "$AQSS_SIMULATOR" --app-info "$RUNNER_TEMP/sound-check-build/Build/Products/Release-iphonesimulator/AQSSReadOnly.app/Info.plist" --support-report --completed-check --output "$RUNNER_TEMP/support-report-populated-clipboard"
      - name: Clear isolated clipboard fixture
        if: always() && env.AQSS_SIMULATOR != ''
        run: python3 tools/check_ios_build_share_clipboard.py clear "$AQSS_SIMULATOR" --output "$RUNNER_TEMP/build-share-clipboard"
      - name: Export compact screenshot evidence
        if: always()
        shell: bash
        run: |
          python3 tools/export_ios_input_screenshots.py "$RUNNER_TEMP" denied build-share-copy support-report-cancel support-report-copy settings voice-microphone granted support-report-populated-build-only support-report-build-only-cancel support-report-build-only-copy
      - name: Keep Simulator test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-sound-check-evidence
          path: |
            ${{ runner.temp }}/sound-denied.xcresult
            ${{ runner.temp }}/sound-support-report-cancel.xcresult
            ${{ runner.temp }}/sound-support-report-copy.xcresult
            ${{ runner.temp }}/support-report-clipboard
            ${{ runner.temp }}/sound-support-report-build-only-cancel.xcresult
            ${{ runner.temp }}/sound-support-report-build-only-copy.xcresult
            ${{ runner.temp }}/support-report-build-only-clipboard
            ${{ runner.temp }}/sound-build-share-copy.xcresult
            ${{ runner.temp }}/sound-settings.xcresult
            ${{ runner.temp }}/sound-voice-microphone.xcresult
            ${{ runner.temp }}/sound-granted.xcresult
            ${{ runner.temp }}/support-report-populated-clipboard
            ${{ runner.temp }}/support-report-populated-build-only-clipboard
            ${{ runner.temp }}/sound-support-report-populated-build-only.xcresult
            ${{ runner.temp }}/sound-check-screenshots
            ${{ runner.temp }}/build-share-clipboard
          if-no-files-found: ignore
          retention-days: 7

  ios-build-details-share-ipad:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and prepare iPad share test
        shell: bash
        run: |
          set -euo pipefail
          ipad_udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPad") and d.get("isAvailable",True)))')"
          echo "AQSS_SHARE_IPAD=$ipad_udid" >> "$GITHUB_ENV"
          xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj -scheme AQSSReadOnly \
            -configuration Release -destination "platform=iOS Simulator,id=$ipad_udid" \
            -derivedDataPath "$RUNNER_TEMP/build-share-ipad" CODE_SIGNING_ALLOWED=NO build-for-testing
          xcrun simctl boot "$ipad_udid" || true
          xcrun simctl bootstatus "$ipad_udid" -b
          xcrun simctl install "$ipad_udid" "$RUNNER_TEMP/build-share-ipad/Build/Products/Release-iphonesimulator/AQSSReadOnly.app"
          python3 - "$RUNNER_TEMP/build-share-ipad/Build/Products" <<'PYTHON'
          import pathlib, plistlib, sys
          root = pathlib.Path(sys.argv[1])
          source, = root.glob('*.xctestrun')
          data = plistlib.loads(source.read_bytes())
          info = plistlib.loads((root / 'Release-iphonesimulator/AQSSReadOnly.app/Info.plist').read_bytes())
          assert all(isinstance(info.get(key), str) and info[key] for key in ('CFBundleShortVersionString', 'CFBundleVersion'))
          targets = [value for value in data.values() if isinstance(value, dict) and value.get('IsUITestBundle')]
          assert len(targets) == 1
          environment = targets[0].setdefault('EnvironmentVariables', {})
          environment['AQSS_TEST_APP_VERSION'] = info['CFBundleShortVersionString']
          environment['AQSS_TEST_APP_BUILD'] = info['CFBundleVersion']
          (root / 'build-share-ipad.xctestrun').write_bytes(plistlib.dumps(data))
          PYTHON
      - name: Verify native build-only report Cancel
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_ios_build_share_clipboard.py prepare "$AQSS_SHARE_IPAD" --output "$RUNNER_TEMP/support-report-ipad-build-only-clipboard"
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/build-share-ipad/Build/Products/build-share-ipad.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SHARE_IPAD" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-support-report-ipad-build-only-cancel.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPrivateSupportReportBuildOnlyCancelReturnsWithoutCopy
          python3 tools/check_ios_build_share_clipboard.py cancel "$AQSS_SHARE_IPAD" --output "$RUNNER_TEMP/support-report-ipad-build-only-clipboard"
      - name: Verify native iPad popover cancellation
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_ios_build_share_clipboard.py prepare "$AQSS_SHARE_IPAD" --output "$RUNNER_TEMP/build-share-clipboard"
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/build-share-ipad/Build/Products/build-share-ipad.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SHARE_IPAD" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-build-share-ipad.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testBuildDetailsShareCancelReturnsWithoutCopy
          python3 tools/check_ios_build_share_clipboard.py cancel "$AQSS_SHARE_IPAD" --output "$RUNNER_TEMP/build-share-clipboard"
      - name: Verify native iPad Copy and exact clipboard handoff
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/build-share-ipad/Build/Products/build-share-ipad.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SHARE_IPAD" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-build-share-ipad-copy.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testBuildDetailsShareOnlyInstalledMetadataAndReturn
          python3 tools/check_ios_build_share_clipboard.py copy "$AQSS_SHARE_IPAD" --app-info "$RUNNER_TEMP/build-share-ipad/Build/Products/Release-iphonesimulator/AQSSReadOnly.app/Info.plist" --output "$RUNNER_TEMP/build-share-clipboard"
      - name: Verify native ipad-support report cancel
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_ios_build_share_clipboard.py prepare "$AQSS_SHARE_IPAD" --output "$RUNNER_TEMP/support-report-clipboard"
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/build-share-ipad/Build/Products/build-share-ipad.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SHARE_IPAD" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-support-report-ipad-cancel.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPrivateSupportReportCancelReturnsWithoutCopy
          python3 tools/check_ios_build_share_clipboard.py cancel "$AQSS_SHARE_IPAD" --output "$RUNNER_TEMP/support-report-clipboard"
      - name: Verify native ipad-support report copy
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/build-share-ipad/Build/Products/build-share-ipad.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SHARE_IPAD" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-support-report-ipad-copy.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPrivateSupportReportSharesOnlyPreviewedFieldsAndReturns
          python3 tools/check_ios_build_share_clipboard.py copy "$AQSS_SHARE_IPAD" --app-info "$RUNNER_TEMP/build-share-ipad/Build/Products/Release-iphonesimulator/AQSSReadOnly.app/Info.plist" --support-report --output "$RUNNER_TEMP/support-report-clipboard"
      - name: Verify exact native build-only report Copy
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          :
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/build-share-ipad/Build/Products/build-share-ipad.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SHARE_IPAD" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-support-report-ipad-build-only-copy.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testPrivateSupportReportBuildOnlyCopySharesOnlyBuildDetails
          python3 tools/check_ios_build_share_clipboard.py copy "$AQSS_SHARE_IPAD" --app-info "$RUNNER_TEMP/build-share-ipad/Build/Products/Release-iphonesimulator/AQSSReadOnly.app/Info.plist" --output "$RUNNER_TEMP/support-report-ipad-build-only-clipboard"
      - name: Clear isolated iPad clipboard fixture
        if: always() && env.AQSS_SHARE_IPAD != ''
        run: python3 tools/check_ios_build_share_clipboard.py clear "$AQSS_SHARE_IPAD" --output "$RUNNER_TEMP/build-share-clipboard"
      - name: Export iPad share screenshot evidence
        if: always()
        run: python3 tools/export_ios_input_screenshots.py "$RUNNER_TEMP" build-share-ipad build-share-ipad-copy support-report-ipad-cancel support-report-ipad-copy support-report-ipad-build-only-cancel support-report-ipad-build-only-copy
      - name: Keep iPad share evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-details-share-ipad-evidence
          path: |
            ${{ runner.temp }}/sound-build-share-ipad.xcresult
            ${{ runner.temp }}/sound-support-report-ipad-cancel.xcresult
            ${{ runner.temp }}/sound-support-report-ipad-copy.xcresult
            ${{ runner.temp }}/support-report-clipboard
            ${{ runner.temp }}/sound-support-report-ipad-build-only-cancel.xcresult
            ${{ runner.temp }}/sound-support-report-ipad-build-only-copy.xcresult
            ${{ runner.temp }}/support-report-ipad-build-only-clipboard
            ${{ runner.temp }}/sound-build-share-ipad-copy.xcresult
            ${{ runner.temp }}/sound-check-screenshots
            ${{ runner.temp }}/build-share-clipboard
          if-no-files-found: ignore
          retention-days: 7

  ios-voice-speech-permission-settings:
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build isolated speech-consent fixture on a fresh iPhone Simulator
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("iPhone") and d.get("isAvailable",True)))')"
          echo "AQSS_SIMULATOR=$simulator_udid" >> "$GITHUB_ENV"
          xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj -scheme AQSSReadOnly \
            -configuration Release -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$RUNNER_TEMP/voice-permission-build" CODE_SIGNING_ALLOWED=NO build-for-testing
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl install "$simulator_udid" "$RUNNER_TEMP/voice-permission-build/Build/Products/Release-iphonesimulator/AQSSReadOnly.app"
          xcrun simctl privacy "$simulator_udid" grant microphone com.aqss.bodyguard.prototype
          python3 - "$RUNNER_TEMP/voice-permission-build/Build/Products" <<'PYTHON'
          import pathlib, plistlib, sys
          root = pathlib.Path(sys.argv[1])
          source, = root.glob('*.xctestrun')
          data = plistlib.loads(source.read_bytes())
          targets = [v for v in data.values() if isinstance(v, dict) and v.get('IsUITestBundle')]
          assert len(targets) == 1
          targets[0].setdefault('EnvironmentVariables', {})['AQSS_TEST_SPEECH_DENIED'] = '1'
          (root / 'voice-speech.xctestrun').write_bytes(plistlib.dumps(data))
          PYTHON
      - name: Verify real speech denial and app-specific Settings recovery
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -xctestrun "$RUNNER_TEMP/voice-permission-build/Build/Products/voice-speech.xctestrun" \
            -destination "platform=iOS Simulator,id=$AQSS_SIMULATOR" \
            -parallel-testing-enabled NO -resultBundlePath "$RUNNER_TEMP/sound-voice-speech.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testVoiceSpeechSettingsReturnStaysOff
      - name: Export speech-permission screenshot evidence
        if: always()
        run: python3 tools/export_ios_input_screenshots.py "$RUNNER_TEMP" voice-speech
      - name: Keep isolated speech Settings evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-voice-speech-settings-evidence
          path: |
            ${{ runner.temp }}/sound-voice-speech.xcresult
            ${{ runner.temp }}/sound-check-screenshots
          if-no-files-found: ignore
          retention-days: 7
