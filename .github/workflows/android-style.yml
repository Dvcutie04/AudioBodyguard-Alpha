name: Simple setup verification — Android and iOS

on:
  push:
    branches: ["aqss/simple-setup"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-style-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  android-live-input:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - uses: android-actions/setup-android@v4
      - name: Compile, test input arithmetic and freshness, and check Android lint
        run: |
          sdkmanager "platforms;android-36"
          gradle -p native/android :testDebugUnitTest :app:assembleLiveInput :app:lintLiveInput :uiprobe:assembleDebug :sharereceiver:assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Inspect permission, input, lifecycle and time limit in Android 16
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim -delay-adb
          script: |
            timeout 600 python3 tools/smoke_android_live_input.py --style-only
      - name: Verify APK signature, opening poster and exact source identity
        run: python3 tools/record_android_test_apk.py
      - name: Retain live test APK
        uses: actions/upload-artifact@v4
        with:
          name: AudioBodyguard-Live-Input-Test
          path: native/android/app/build/outputs/apk/liveInput/app-liveInput.apk
          if-no-files-found: error
          retention-days: 14
      - name: Retain test and UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-input-verification
          path: |
            artifacts/ui/android-live-input/
            native/android/build/test-results/testDebugUnitTest/
            native/android/app/build/reports/lint-results-liveInput.*
          if-no-files-found: ignore
          retention-days: 14

  ios-simple-setup:
    name: Simple setup on ${{ matrix.device }}
    strategy:
      fail-fast: false
      matrix:
        device: [iPhone, iPad]
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test shared guide defaults and restoration
        run: swift test --package-path native/ios
      - name: Walk through setup and contextual help at normal and largest text
        shell: bash
        run: |
          set -euo pipefail
          simulator_udid="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; print(next(d["udid"] for group in json.load(sys.stdin)["devices"].values() for d in group if d["name"].startswith("${{ matrix.device }}") and d.get("isAvailable",True)))')"
          xcrun simctl boot "$simulator_udid" || true
          xcrun simctl bootstatus "$simulator_udid" -b
          xcrun simctl spawn "$simulator_udid" defaults write com.apple.Accessibility ReduceMotionEnabled -bool YES
          xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj -scheme AQSSReadOnly \
            -configuration Release -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$RUNNER_TEMP/simple-derived" -parallel-testing-enabled NO \
            -resultBundlePath "$RUNNER_TEMP/sound-simplified.xcresult" \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testSimplifiedSetupAndContextualJumps \
            -only-testing:AQSSReadOnlyUITests/AQSSReadOnlyUITests/testSimplifiedSetupWithLargestTextAndReducedMotion \
            CODE_SIGNING_ALLOWED=NO test
      - name: Export native screenshots
        if: always()
        run: python3 tools/export_ios_input_screenshots.py "$RUNNER_TEMP" simplified
      - name: Retain native UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simple-setup-${{ matrix.device }}-ui
          path: ${{ runner.temp }}/sound-check-screenshots/
          if-no-files-found: ignore
          retention-days: 14
      - name: Retain native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simple-setup-${{ matrix.device }}-results
          path: ${{ runner.temp }}/sound-simplified.xcresult
          if-no-files-found: ignore
          retention-days: 14
      - name: Package iPhone Simulator app
        if: matrix.device == 'iPhone'
        run: ditto -c -k --keepParent "$RUNNER_TEMP/simple-derived/Build/Products/Release-iphonesimulator/AQSSReadOnly.app" "$RUNNER_TEMP/AudioBodyguard-Simple-Setup-iOS-Simulator.app.zip"
      - name: Retain iPhone Simulator app
        if: matrix.device == 'iPhone'
        uses: actions/upload-artifact@v4
        with:
          name: simple-setup-iOS-Simulator
          path: ${{ runner.temp }}/AudioBodyguard-Simple-Setup-iOS-Simulator.app.zip
          if-no-files-found: error
          retention-days: 14
