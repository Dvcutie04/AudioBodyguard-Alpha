name: AQSS-36-OMEGA CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-asyncio anyio cryptography

      - name: Verify dependencies
        run: |
          python -c "import cryptography, pytest_asyncio; print('Dependencies verified successfully')"

      - name: Run Pytest Suite
        run: |
          pytest --cov=src --cov-report=term-missing
        env:
          PYTHONPATH: ${{ github.workspace }}
