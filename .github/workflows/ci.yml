name: AQSS-36-OMEGA CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "aqss/**" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: aqss-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python contracts and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify generated native contracts
        run: python tools/generate_native_feedback_contracts.py --check

      - name: Run deterministic safety and full pytest suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  native-lab:
    name: C11 owned-output lab (scripted backend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run deterministic owner checks
        run: sh native/lab/owned_output/run_tests.sh
      - name: Check owner memory and undefined behavior
        env:
          AQSS_LAB_SANITIZE: "1"
        run: sh native/lab/owned_output/run_tests.sh

  native-swift:
    name: Swift contracts and read-only iOS simulator screen
    runs-on: macos-14
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test Swift contract
        run: swift test --package-path native/ios
      - name: Compile read-only iOS simulator application
        run: xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj -scheme AQSSReadOnly -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - name: Run read-only iPhone Simulator UI checks
        run: bash tools/run_ios_read_only_smoke.sh "$RUNNER_TEMP"
      - name: Keep iOS simulation evidence briefly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqss-ios-simulation
          path: |
            ${{ runner.temp }}/aqss-ios-simulation.png
            ${{ runner.temp }}/aqss-ios-simulator-app.zip
          if-no-files-found: warn
          retention-days: 3

  native-android:
    name: Android contracts and read-only emulator screen
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - name: Compile Android contract tests and read-only APK
        run: gradle -p native/android testDebugUnitTest :app:assembleDebug
      - name: Run read-only Android Emulator UI checks
        run: bash tools/run_android_read_only_smoke.sh "$RUNNER_TEMP"
      - name: Keep Android simulation evidence briefly
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aqss-android-simulation
          path: |
            native/android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/aqss-android-simulation.png
            ${{ runner.temp }}/aqss-android-emulator-startup.log
          if-no-files-found: warn
          retention-days: 3
