name: AQSS-36-OMEGA CI Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "aqss/**" ]
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: read

concurrency:
  group: aqss-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python contracts and regression suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify generated native contracts
        run: python tools/generate_native_feedback_contracts.py --check

      - name: Run deterministic safety and full pytest suite
        env:
          PYTHONPATH: .
        run: python -m pytest -q

  native-lab:
    name: C11 owned-output lab (scripted backend)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and run deterministic owner checks
        run: sh native/lab/owned_output/run_tests.sh
      - name: Check owner memory and undefined behavior
        env:
          AQSS_LAB_SANITIZE: "1"
        run: sh native/lab/owned_output/run_tests.sh

  native-swift:
    name: Swift contracts and read-only iOS simulator app
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile and test Swift contract
        run: swift test --package-path native/ios
      - name: Compile read-only iOS simulator application
        run: xcodebuild -project native/ios-app/AQSSReadOnly.xcodeproj -scheme AQSSReadOnly -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build

  native-android:
    name: Android contracts and read-only APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36"
      - name: Compile Android contract tests and read-only APK
        run: gradle -p native/android testDebugUnitTest :app:assembleDebug
